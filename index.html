<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>阪神タイガース登場曲アーカイブ</title>

<style>
body{
    font-family:sans-serif;
    margin:20px;
    max-width:1000px;
    margin:auto;
    padding:20px;
}

h1,h2,h3{
    color:#222;
}

select{
    padding:8px;
    margin:5px;
}

.player{
    cursor:pointer;
    padding:8px;
    border-bottom:1px solid #ddd;
}

.player:hover{
    background:#f5f5f5;
}

.change-block{
    border:1px solid #ddd;
    border-radius:8px;
    padding:12px;
    margin-bottom:16px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:left;
}

th{
    background:#f0f0f0;
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<h1>阪神タイガース登場曲アーカイブ</h1>

<div>
    <label>年度：</label>
    <select id="yearSelect"></select>
</div>

<hr>

<div id="playerList"></div>

<div id="playerDetail" class="hidden"></div>

<script>

let allData = [];

fetch("archive_20261020.csv")
.then(res => res.text())
.then(text => {

    const rows = text.trim().split("\n");
    const headers = rows[0].split(",");

    allData = rows.slice(1).map(row => {

        const values = row.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);

        return {
            year: values[0],
            player: values[1],
            artist: values[2],
            song: values[3],
            condition: values[4] || "",
            note: values[5] || "",
            order: values[6] || "1"
        };
    });

    initializeYears();
});

function initializeYears(){

    const years = [...new Set(allData.map(r=>r.year))]
        .sort((a,b)=>b-a);

    const select = document.getElementById("yearSelect");

    years.forEach(year=>{

        const option = document.createElement("option");
        option.value = year;
        option.textContent = year + "年";
        select.appendChild(option);

    });

    select.addEventListener("change", ()=>{
        showPlayers(select.value);
    });

    showPlayers(years[0]);
}

function showPlayers(year){

    document.getElementById("playerDetail")
        .classList.add("hidden");

    const players =
        [...new Set(
            allData
            .filter(r=>r.year===year)
            .map(r=>r.player)
        )]
        .sort();

    const div = document.getElementById("playerList");

    div.innerHTML =
        `<h2>${year}年 選手一覧</h2>`;

    players.forEach(player=>{

        const p = document.createElement("div");

        p.className = "player";
        p.textContent = player;

        p.onclick = ()=>{
            showPlayerDetail(year,player);
        };

        div.appendChild(p);

    });
}

function showPlayerDetail(year,player){

    const rows = allData.filter(
        r =>
        r.year===year &&
        r.player===player
    );

    const grouped = {};

    rows.forEach(row=>{

        if(!grouped[row.order]){
            grouped[row.order] = [];
        }

        grouped[row.order].push(row);

    });

    const orders =
        Object.keys(grouped)
        .sort((a,b)=>a-b);

    let html =
        `<h2>${player} (${year}年)</h2>`;

    orders.forEach(order=>{

        html += `
        <div class="change-block">
        <h3>変更履歴 ${order}</h3>
        <table>
        <tr>
        <th>条件</th>
        <th>曲名</th>
        <th>歌手名</th>
        <th>備考</th>
        </tr>
        `;

        grouped[order].forEach(row=>{

            html += `
            <tr>
            <td>${row.condition}</td>
            <td>${row.song}</td>
            <td>${row.artist}</td>
            <td>${row.note}</td>
            </tr>
            `;

        });

        html += `
        </table>
        </div>
        `;

    });

    const detail =
        document.getElementById("playerDetail");

    detail.innerHTML = html;
    detail.classList.remove("hidden");

    detail.scrollIntoView({
        behavior:"smooth"
    });
}
</script>

</body>
</html>
