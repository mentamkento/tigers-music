<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>阪神タイガース登場曲アーカイブ</title>

<style>

body{
    font-family:sans-serif;
    max-width:1200px;
    margin:0 auto;
    padding:20px;
    line-height:1.6;
}

h1{
    margin-bottom:20px;
}

h2{
    margin-top:30px;
}

select{
    padding:8px;
    font-size:16px;
}

.player{
    padding:8px;
    border-bottom:1px solid #ddd;
    cursor:pointer;
}

.player:hover{
    background:#f5f5f5;
}

.change-block{
    margin-bottom:20px;
}

table{
    width:100%;
    table-layout:fixed;
    border-collapse:collapse;
}

th,
td{
    border:1px solid #ddd;
    padding:8px;
    vertical-align:top;
    white-space:normal;
    word-break:break-word;
}

th{
    background:#f5f5f5;
}

th:nth-child(1),
td:nth-child(1){
    width:20%;
}

th:nth-child(2),
td:nth-child(2){
    width:35%;
}

th:nth-child(3),
td:nth-child(3){
    width:35%;
}

th:nth-child(4),
td:nth-child(4){
    width:10%;
}

.hidden{
    display:none;
}

.back-button{
    margin-bottom:15px;
    padding:8px 12px;
    cursor:pointer;
}

</style>
</head>

<body>

<h1>阪神タイガース登場曲アーカイブ</h1>

<label for="yearSelect">年度：</label>

<select id="yearSelect"></select>

<hr>

<div id="playerList"></div>

<div id="playerDetail" class="hidden"></div>

<script>

let allData = [];

fetch("archive_20261020.csv")
.then(response => response.text())
.then(text => {

    const rows = text.trim().split("\n");

    allData = rows.slice(1).map(row => {

        const values =
            row.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);

        return {
            year: values[0],
            player: values[1],
            artist: values[2],
            song: values[3],
            condition: values[4] || "",
            note: values[5] || "",
            order: values[6] || "1"
        };
    });

    setupYearSelect();

});

function setupYearSelect(){

    const select =
        document.getElementById("yearSelect");

    const years =
        [...new Set(allData.map(r => r.year))]
        .sort((a,b) => b-a);

    years.forEach(year => {

        const option =
            document.createElement("option");

        option.value = year;
        option.textContent = year + "年";

        select.appendChild(option);

    });

    select.addEventListener("change", () => {

        showPlayers(select.value);

    });

    showPlayers(years[0]);

}

function showPlayers(year){

    document.getElementById("playerDetail")
        .classList.add("hidden");

    const players =
        [...new Set(
            allData
            .filter(r => r.year === year)
            .map(r => r.player)
        )]
        .sort();

    const list =
        document.getElementById("playerList");

    list.innerHTML =
        `<h2>${year}年 選手一覧</h2>`;

    players.forEach(player => {

        const div =
            document.createElement("div");

        div.className = "player";
        div.textContent = player;

        div.onclick = () => {
            showPlayerDetail(year, player);
        };

        list.appendChild(div);

    });

}

function showPlayerDetail(year, player){

    const rows =
        allData.filter(r =>
            r.year === year &&
            r.player === player
        );

    const grouped = {};

    rows.forEach(row => {

        if(!grouped[row.order]){

            grouped[row.order] = [];

        }

        grouped[row.order].push(row);

    });

    const orders =
        Object.keys(grouped)
        .sort((a,b) => a-b);

    let html = `
        <button class="back-button"
            onclick="document.getElementById('playerDetail').classList.add('hidden')">
            閉じる
        </button>

        <h2>${player} (${year}年)</h2>
    `;

    orders.forEach(order => {

        html += `
        <div class="change-block">

        <table>

            <tr>
                <th>条件</th>
                <th>曲名</th>
                <th>歌手名</th>
                <th>備考</th>
            </tr>
        `;

        grouped[order].forEach(row => {

            html += `
            <tr>
                <td>${row.condition}</td>
                <td>${row.song}</td>
                <td>${row.artist}</td>
                <td>${row.note}</td>
            </tr>
            `;

        });

        html += `
        </table>

        </div>
        `;

    });

    const detail =
        document.getElementById("playerDetail");

    detail.innerHTML = html;

    detail.classList.remove("hidden");

    detail.scrollIntoView({
        behavior:"smooth"
    });

}

</script>

</body>
</html>
``
